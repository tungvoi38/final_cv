name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.1
        with:
          version: "0.11.6"
          enable-cache: true
      - run: uv sync --locked --group dev --no-editable
      - run: uv run --locked --no-editable ruff check .
      - run: uv run --locked --no-editable ruff format --check .
      - run: uv run --locked --no-editable pytest -q
      - run: uv run --locked --no-editable python scripts/check_governance.py
