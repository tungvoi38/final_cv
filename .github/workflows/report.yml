name: Research report
on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * 1"
  push:
    branches: [main]
    paths: ["docs/**", "reports/progress.yaml", "src/geoid/tracking/**", "scripts/generate_report.py"]
permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: read
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.1
        with:
          version: "0.11.6"
          enable-cache: true
      - run: uv sync --locked --group dev --no-editable
      - name: Generate report
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: uv run --locked --no-editable python scripts/generate_report.py --github
      - name: Job summary
        run: cat reports/STATUS.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: research-status
          path: reports/STATUS.md
          retention-days: 30
